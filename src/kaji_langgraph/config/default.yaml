model:
  provider: ollama
  name: gemma4:31b-cloud
  base_url: http://localhost:11434
  temperature: 0.0

policy:
  require_evidence_quotes: true
  full_page_retrieval: true
  page_fetch_timeout_seconds: 5
  page_max_bytes: 1000000
  page_text_limit: 20000
  search_calls_per_round: 2
  max_search_calls: 5
  max_scrapes: 2
  max_execution_time_seconds: 120
  max_token_limit: 32000
  max_results_per_search: 5
  max_stagnant_rounds: 2

domains:
  general: {}
  scientific:
    require_https: true
    max_search_calls: 8
    max_execution_time_seconds: 180
  political:
    max_search_calls: 6
    max_scrapes: 3
  health_medical:
    require_peer_reviewed: true
    max_search_calls: 8
    max_scrapes: 1
    max_execution_time_seconds: 180

