[project]
name = "kaji-langgraph"
version = "0.1.0"
description = "Standalone LangGraph implementation of KajiAI's evidence-driven claim analysis workflow"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "langchain-ollama>=1.0.0",
    "langgraph>=1.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "typesafe-sdk>=0.7.1,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kaji-langgraph = "kaji_langgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaji_langgraph"]

[tool.hatch.build.targets.wheel.force-include]
"src/kaji_langgraph/config/default.yaml" = "kaji_langgraph/config/default.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
